<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for browsers that ignore SVG favicons (Safari, older Edge). -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <!-- iOS home screen. Opaque by design: iOS applies its own rounding and
         renders a transparent PNG on black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- interactive-widget=resizes-content makes Android shrink the layout
         viewport when the keyboard opens instead of overlaying it, so a CTA in
         normal flow stays reachable. iOS ignores it; see useViewportHeight. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fff9ee" />
    <!-- Home-screen label. Without this iOS derives it from <title>. -->
    <meta name="apple-mobile-web-app-title" content="Whose Turn?" />
    <meta name="application-name" content="Whose Turn?" />

    <!-- ===================================================================
         SEARCH RESULTS
         What Google actually renders for an ordinary page is the favicon, the
         title and this description — NOT og:image. Those three are set above
         and here; the social card below is a separate surface.
         =================================================================== -->
    <title>Whose Turn?</title>
    <meta
      name="description"
      content="Settle chore disputes fairly: set up your household once, pick the chore nobody wants, and let a spin, a dice roll or a coin toss decide whose turn it is."
    />

    <!-- ===================================================================
         LINK PREVIEW CARD
         The origin in the URLs below is substituted by Vite at build time from
         VITE_SITE_ORIGIN in .env. Crawlers reject relative image paths, so
         these have to be absolute — and holding the host in one variable means
         a domain change is one edit rather than four.
         (Do not write the placeholder token itself in a comment: Vite happily
         substitutes it here too, and the comment stops making sense.)
         =================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Whose Turn?" />
    <meta property="og:title" content="Whose Turn?" />
    <meta
      property="og:description"
      content="Settle chore disputes fairly: set up your household once, pick the chore nobody wants, and let a spin, a dice roll or a coin toss decide whose turn it is."
    />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%/" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Whose Turn? wordmark on a cream background, framed by two dice, a fortune wheel and a coin."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whose Turn?" />
    <meta
      name="twitter:description"
      content="Settle chore disputes fairly: set up your household once, pick the chore nobody wants, and let a spin, a dice roll or a coin toss decide whose turn it is."
    />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Whose Turn? wordmark on a cream background, framed by two dice, a fortune wheel and a coin."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
